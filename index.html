.char-stack{display:inline-grid;place-items:center}
.char-stack>span{grid-area:1/1;text-align:center}
.layer-es{color:var(--c-emerald);animation:fade-es 4s ease-in-out infinite}
.layer-eu{color:var(--c-cyan);animation:fade-eu 4s ease-in-out infinite}
.progress-track{position:absolute;bottom:9%;width:26%;min-width:130px;max-width:240px;height:6px;background:rgba(59,59,61,.14);border-radius:999px;overflow:hidden}
.progress-pill{width:53%;height:100%;border-radius:999px;animation:pill-slide 4s ease-in-out infinite}

@keyframes fade-es{0%,34%,100%{opacity:1;z-index:2}50%,84%{opacity:.24;z-index:1}}
@keyframes fade-eu{0%,34%,100%{opacity:.24;z-index:1}50%,84%{opacity:1;z-index:2}}
@keyframes pill-slide{0%,34%,100%{transform:translateX(0%);background-color:var(--c-emerald)}42%,92%{background-color:var(--c-lime)}50%,84%{transform:translateX(88.6%);background-color:var(--c-cyan)}}

#goEu{background:var(--tu);color:#fff}

  <div id="app" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>
  </div>
</main>

function toLatex(str){
  let s=String(str==null?'':str).trim();
  if(s.includes('\\'))return s;
  s=s.replace(/[-\u2212\u2013\u2014]/g,'-').replace(/[*\u00d7]/g,'\u00b7').replace(/[\u00f7:]/g,'/');
  let i=0;
  function group(stop){
    const at=[];
    while(i<s.length){
      const c=s[i];
      if(c===')'&&stop)break;
      if(c==='('){i++;const inner=group(true);if(s[i]===')')i++;at.push({t:'a',h:'('+inner+')'});continue;}
      if(/[0-9.,]/.test(c)){let j=i;while(j<s.length&&/[0-9.,]/.test(s[j]))j++;at.push({t:'a',h:s.slice(i,j)});i=j;continue;}
      if(/\p{L}/u.test(c)){at.push({t:'a',h:c});i++;continue;}
      if(c==='/'){at.push({t:'/'});i++;continue;}
      if(c==='^'){i++;let j=i;if(s[i]==='('){let dep=0;while(j<s.length){if(s[j]==='(')dep++;if(s[j]===')'){dep--;if(!dep){j++;break;}}j++;}at.push({t:'p',h:s.slice(i,j).replace(/^\(|\)$/g,'')});}
        else{while(j<s.length&&/[0-9]/.test(s[j]))j++;at.push({t:'p',h:s.slice(i,j)||'2'});}
        i=j;continue;}
      if(c==='+'||c==='-'||c==='='||c==='\u00b7'){at.push({t:'o',v:c});i++;continue;}
      if(c===' '){i++;continue;}
      at.push({t:'a',h:c});i++;
    }
    for(let k=0;k<at.length;k++){
      if(at[k].t==='p'&&at[k-1]&&at[k-1].t==='a'){at.splice(k-1,2,{t:'a',h:at[k-1].h+'^{'+at[k].h+'}'});k--;}
    }
    for(let k=0;k<at.length;k++){
      if(at[k].t==='o'&&at[k].v==='-'&&at[k+1]&&at[k+1].t==='a'){
        const p=at[k-1];
        if(!p||p.t==='o'||p.t==='/'){at.splice(k,2,{t:'a',h:'-'+at[k+1].h});k--;}
      }
    }
    for(let k=0;k<at.length-1;k++){
      if(at[k].t==='a'&&at[k+1].t==='a'){at.splice(k,2,{t:'a',h:at[k].h+at[k+1].h});k--;}
    }
    for(let k=0;k<at.length;k++){
      if(at[k].t==='/'&&at[k-1]&&at[k-1].t==='a'&&at[k+1]&&at[k+1].t==='a'){
        let num=at[k-1].h,den=at[k+1].h,sign='';
        if(num.startsWith('-(')&&num.endsWith(')')){sign='- ';num=num.slice(2,-1);}
        else if(num.startsWith('(')&&num.endsWith(')')){num=num.slice(1,-1);}
        if(den.startsWith('(')&&den.endsWith(')')){den=den.slice(1,-1);}
        at.splice(k-1,3,{t:'a',h:sign+'\\dfrac{'+num+'}{'+den+'}'});k-=2;
      }
    }
    return at.map(q=>{
      if(q.t==='o')return q.v==='\u00b7'?' \\cdot ':' '+q.v+' ';
      if(q.t==='/')return'/';
      return q.h;
    }).join('').replace(/\s{2,}/g,' ').trim();
  }
  return group(false);
}
function mathFallbackHTML(str){
  let s=String(str==null?'':str).replace(/[-\u2212\u2013\u2014]/g,'-').replace(/[*\u00d7]/g,'\u00b7').replace(/[\u00f7:]/g,'/');

function panItems(p,W){

  for(let i=0;i<nx;i++)out.push({k:kx,val:1});

  const u=Math.max(1,Math.round((W&&W[kw])||1));

function viewList(prev,cur,W){

  const cnt=list=>{const m=new Map();list.forEach(it=>m.set(key(it),(m.get(key(it))||0)+1));return m;};
  const a=prev?cnt(panItems(prev,W)):null,b=cnt(panItems(cur,W));
  const ks=[];const push=k=>{if(ks.indexOf(k)<0)ks.push(k);};
  if(a)a.forEach((v,k)=>push(k));b.forEach((v,k)=>push(k));
  ks.sort((p,q)=>{
    const sp=p.split(':'),sq=q.split(':');
    return KORD[sp[0]]-KORD[sq[0]]||(+sq[1])-(+sp[1]);
  });

  ks.forEach(kk=>{
    const sp=kk.split(':'),k=sp[0],val=+sp[1];
    const pn=a?(a.get(kk)||0):0,cn=b.get(kk)||0,n=Math.max(pn,cn);

}

async function postBatch(batch){
  const body=JSON.stringify({token:CONFIG.TOKEN,rows:batch});
  const hdr={'Content-Type':'text/plain;charset=utf-8'};
  let resp;
  try{resp=await fetch(CONFIG.ENDPOINT,{method:'POST',headers:hdr,body,redirect:'follow'});}
  catch(e){
    await fetch(CONFIG.ENDPOINT,{method:'POST',mode:'no-cors',headers:hdr,body});
    return'unconf';
  }
  let j=null;try{j=await resp.json();}catch(e){return'rej';}
  return(j&&j.ok)?'ok':'rej';
}
function flush(){
  if(flushP)return flushP;
  if(!CONFIG.ENDPOINT||!queue.length)return Promise.resolve();
  flushP=(async()=>{
    sending=true;updateSync();
    try{
      while(queue.length){
        const batch=queue.slice(0,25);
        const r=await postBatch(batch);
        if(r==='rej'){syncState='rej';break;}
        queue.splice(0,batch.length);saveQueue();syncState=r;
      }
    }catch(e){syncState='fail';}
    sending=false;flushP=null;updateSync();
  })();
  return flushP;
}

function rndTask(lvl,sol){
  const seed=1+Math.floor(Math.random()*9000);
  const g=gen(lvl,seed,sol);
  return{task:{L:{x:g.a,c:g.b},R:{x:g.c,c:g.d},X:g.x},seed:seed+'-'+sol};
}
function makeEx(mode,lvl,sol,free,tk){
  let task,seed,prob=null;
  if(mode>=6){
    const s=1+Math.floor(Math.random()*9000);
    prob=genProb(mode===7?'c':'e',s);seed=s+'-p';
    task={L:{x:1,c:0},R:{x:0,c:prob.a[0]},X:prob.a[0]};
  }
  else if(mode>=4){const s=1+Math.floor(Math.random()*9000);task=genW(lvl,s);seed=s+'-w';}
  else{const t=tk||rndTask(lvl,sol);task=t.task;seed=t.seed;}
  const ex={id:++exCount,mode,free:!!free,lvl,content:sol,seed,task,prob,psent:false,
    built:{L:{x:0,c:0},R:{x:0,c:0}},st3:clone(task),hist:[],W:{u:1,g:1},
    logArr:[{parts:[{key:'l_init'}],state:clone(task)}],
    wlines:[{L:clone(task.L),R:clone(task.R),d:null}],
    angle:0,anim:null,locked:false,checked:false,result:'',answer:'',fbs:{main:null,v:null},
    steps:0,solvedLogged:false,showSol:false,dimK:null,el:null};
  EX[ex.id]=ex;
  return ex;
}
function pickSet(mode){
  const out=[],seen=new Set();
  for(let lvl=1;lvl<=4;lvl++){
    shuf(SOLS.slice()).slice(0,2).forEach(sol=>{
      let tk,t=0;
      do{tk=rndTask(lvl,sol);t++;}while(seen.has(fmtInt(tk.task))&&t<20);
      seen.add(fmtInt(tk.task));
      out.push(makeEx(mode,lvl,sol,false,tk));
    });
  }
  return out;
}

function check1(ex){

  if(e.vars.size===0){setFb(ex,'bad',()=>tr('f1_noletter'));track('traduce','sin letra',raw,ex);return;}
  const tg={L:{a:ex.task.L.x,b:ex.task.L.c},R:{a:ex.task.R.x,b:ex.task.R.c}};
  const j=judge(e,tg);ex.answer=raw;
  let res;
  if(j==='exact'||j==='swap'){res='correcto';setFb(ex,'ok',()=>'\u2714 '+tr('f1_ok'),true);}
  else if(j==='equiv'){res='equivalente';setFb(ex,'warn',()=>tr('f1_equiv')+solHTML(ex),true);}
  else{res='incorrecto';setFb(ex,'bad',()=>diag(e,tg,1)+solHTML(ex),true);}
  track('traduce',res,raw,ex);
  logAns(exTabKey(ex),tr('ex_n',[ex.id])+' \u00b7 '+fmtInt(ex.task),raw,resCode(res),fmtInt(ex.task));
  lockEx(ex,res);
}
/* ----- modo 2 ----- */
function tryAdd(q,k,val){
  if(k==='b'){if(q.x>=8)return{ok:false,msg:'maxb'};q.x++;return{ok:true};}
  if(k==='nb'){if(q.x<=-8)return{ok:false,msg:'maxb'};q.x--;return{ok:true};}
  if(k==='u'){if(q.c+val>99)return{ok:false,msg:'maxu'};const note=q.c<0;q.c+=val;return{ok:true,note};}
  if(q.c-val<-99)return{ok:false,msg:'maxg'};
  const note=q.c>0;q.c-=val;return{ok:true,note};
}
function tryRemove(q,k,val){
  if(k==='b'&&q.x>0){q.x--;return true;}
  if(k==='nb'&&q.x<0){q.x++;return true;}
  if(k==='u'&&q.c>=val){q.c-=val;return true;}
  if(k==='g'&&q.c<=-val){q.c+=val;return true;}
  return false;
}
function check2(ex){
  if(ex.locked)return;
  const b=ex.built;
  const e={L:{a:b.L.x,b:b.L.c},R:{a:b.R.x,b:b.R.c}};
  const tg={L:{a:ex.task.L.x,b:ex.task.L.c},R:{a:ex.task.R.x,b:ex.task.R.c}};
  const mine=fmtInt(b);
  if(!b.L.x&&!b.L.c&&!b.R.x&&!b.R.c){setFb(ex,'warn',()=>tr('f2_empty'));track('construye','vac\u00edo','',ex);return;}
  const j=judge(e,tg);ex.answer=mine;
  let res;
  if(j==='exact'){res='correcto';setFb(ex,'ok',()=>'\u2714 '+tr('f2_ok'));}
  else if(j==='swap'){res='correcto';setFb(ex,'ok',()=>'\u2714 '+tr('f2_swap'));}
  else if(j==='equiv'){res='equivalente';setFb(ex,'warn',()=>tr('f2_equiv'));}
  else{res='incorrecto';setFb(ex,'bad',()=>diag(e,tg,2));}
  if(res!=='correcto'&&!ex.free){ex.showSol=true;showSolView(ex);}
  track('construye',res,mine,ex);
  logAns(exTabKey(ex),tr('ex_n',[ex.id])+' \u00b7 '+fmtInt(ex.task),mine,resCode(res),fmtInt(ex.task));
  lockEx(ex,res);
}
/* ----- modo 3 ----- */
function doOp(ex,k,val,sg){
  if(ex.locked||ex.mode!==3)return;
  if(['b','nb','u','g'].indexOf(k)<0)return;
  val=+val||1;
  const s=clone(ex.st3),sd=[s.L,s.R];
  let err='';
  if(k==='b'){
    if(sg==='-'){if(sd.some(p=>p.x<1))err='er_b';else sd.forEach(p=>p.x-=1);}
    else{if(sd.some(p=>p.x+1>8))err='er_b8';else sd.forEach(p=>p.x+=1);}
  }else if(k==='nb'){
    if(sg==='-'){if(sd.some(p=>p.x>-1))err='er_nb';else sd.forEach(p=>p.x+=1);}
    else{if(sd.some(p=>p.x-1<-8))err='er_b8';else sd.forEach(p=>p.x-=1);}
  }else if(k==='u'){
    if(sg==='-'){if(sd.some(p=>p.c<val))err='er_u';else sd.forEach(p=>p.c-=val);}
    else{if(sd.some(p=>p.c+val>99))err='maxu';else sd.forEach(p=>p.c+=val);}
  }else{
    if(sg==='-'){if(sd.some(p=>p.c>-val))err='er_g';else sd.forEach(p=>p.c+=val);}
    else{if(sd.some(p=>p.c-val<-99))err='maxg';else sd.forEach(p=>p.c-=val);}
  }
  if(err){const e2=err;setFb(ex,'warn',()=>tr(e2,[val]));draw(ex);return;}
  pushState(ex,s,{parts:[{key:sg==='-'?'l_rm':'l_add',args:[objName(k,val)]}],sym:symFor(k,val,sg)});
}
function pushState(ex,s,entry){
  entry.prev=clone(ex.st3);entry.state=clone(s);
  ex.hist.push(clone(ex.st3));ex.st3=s;
  ex.logArr.push(entry);ex.steps++;
  clearFb(ex);
  track('paso','\u2014',entryText(entry,'es')+' ('+entry.sym+') \u2192 '+fmtInt(s),ex);
  const sv=solvedVal(s),sn=solvedNeg(s);
  if(sv!==null){
    setFb(ex,'ok',()=>tr('solved'));
    if(!ex.solvedLogged){ex.solvedLogged=true;track('resuelto','correcto','x = '+sv,ex);}
  }else if(sn!==null){setFb(ex,'q',()=>tr('solved_neg'));}
  renderLog(ex);draw(ex);
}
function undo(ex){
  if(ex.locked||!ex.hist.length)return;

/* ----- modo 4: resolver escribiendo ----- */
function renderWLog(ex){
  const lg=ex.el&&ex.el.querySelector('.wlog');if(!lg)return;
  lg.innerHTML=ex.wlines.map((l,i)=>
    '<div class="step"><div class="stepE">'+(i+1)+'. '+mathHTML(fmtEqG(l))+'</div>'+
    (l.d?'<div class="linedesc">'+tr(l.d.key,l.d.args)+'</div>':'')+'</div>').join('');
  lg.scrollTop=lg.scrollHeight;
}
function describeStep(prev,cur){
  const nr=(a,b)=>Math.abs(a-b)<1e-7;
  const dLx=cur.L.x-prev.L.x,dRx=cur.R.x-prev.R.x,dLc=cur.L.c-prev.L.c,dRc=cur.R.c-prev.R.c;
  if(nr(dLx,dRx)&&nr(dLc,dRc)){
    if(nr(dLx,0)&&nr(dLc,0))return{same:true};
    if(dLx<=1e-9&&dLc<=1e-9)return{key:'esc_sub',args:[fmtSideG({x:-dLx,c:-dLc})]};
    return{key:'esc_add',args:[fmtSideG({x:dLx,c:dLc})]};
  }
  const comps=[[prev.L.x,cur.L.x],[prev.L.c,cur.L.c],[prev.R.x,cur.R.x],[prev.R.c,cur.R.c]];
  let f=null;
  for(const c of comps){if(Math.abs(c[0])>1e-9){f=c[1]/c[0];break;}}
  if(f!==null&&Math.abs(f)>1e-9&&comps.every(c=>Math.abs(c[1]-f*c[0])<1e-7)){
    const inv=1/f;
    if(Math.abs(f)>=1-1e-9)return{key:'esc_mul',args:[numSigned(f)]};
    if(Math.abs(inv-Math.round(inv))<1e-9)return{key:'esc_div',args:[numSigned(Math.round(inv))]};
    return{key:'esc_mul',args:[numSigned(f)]};
  }
  return{key:'esc_gen',args:[]};
}
function checkStep(ex){
  if(ex.locked)return;
  const inp=ex.el.querySelector('.wans'),raw=inp.value;
  let e;
  try{e=parseEq(raw);}
  catch(err){const msg=err.message;setFb(ex,'bad',()=>msg);track('escribe','error de escritura',raw,ex);return;}
  if(e.vars.size===0){setFb(ex,'bad',()=>tr('esc_novar'));track('escribe','sin letra',raw,ex);return;}
  const prev=ex.wlines[ex.wlines.length-1];
  const cur={L:{x:e.L.a,c:e.L.b},R:{x:e.R.a,c:e.R.b}};
  const p=prev.L.x-prev.R.x,q=prev.R.c-prev.L.c,p2=cur.L.x-cur.R.x,q2=cur.R.c-cur.L.c;
  if(Math.abs(p2)<1e-9){setFb(ex,'bad',()=>tr('esc_novar'));track('escribe','pierde la x',raw,ex);return;}
  if(Math.abs(p2*q-q2*p)>1e-6){
    const sameL=Math.abs(cur.L.x-prev.L.x)<1e-9&&Math.abs(cur.L.c-prev.L.c)<1e-9;
    const sameR=Math.abs(cur.R.x-prev.R.x)<1e-9&&Math.abs(cur.R.c-prev.R.c)<1e-9;
    const key=(sameL!==sameR)?'esc_one':'esc_bad';
    setFb(ex,'bad',()=>tr(key));track('escribe','paso incorrecto',raw,ex);return;
  }
  const d=describeStep(prev,cur);
  if(d.same){setFb(ex,'warn',()=>tr('esc_same'));return;}
  if(ex.mode===5)d.key='sh_'+d.key.slice(4);
  ex.wlines.push({L:cur.L,R:cur.R,d:{key:d.key,args:d.args}});
  ex.steps++;ex.answer=raw;inp.value='';eqPreview(inp);
  renderWLog(ex);
  track('escribe','paso',fmtEqG(cur),ex);
  const sv=solvedVal(cur),sn=solvedNeg(cur);
  if(sv!==null){
    const l=ex.task.L.x*sv+ex.task.L.c,r=ex.task.R.x*sv+ex.task.R.c;
    setFb(ex,'ok',()=>tr('esc_fin',[numSigned(sv)])+' '+tr('esc_chk',[numAbs(l),numAbs(r)]));
    ex.answer='x = '+sv;
    track('escribe','correcto','x = '+sv,ex);
    logAns(ex.free?'t6':'t6',fmtEqG(ex.task),'x = '+numSigned(sv),'ok','x = '+numSigned(sv));
    lockEx(ex,'correcto');
  }else if(sn!==null){setFb(ex,'q',()=>tr('esc_neg'));}
  else setFb(ex,'ok',()=>tr(d.key,d.args));
}
function undoStep(ex){
  if(ex.locked||ex.wlines.length<2)return;
  ex.wlines.pop();clearFb(ex);renderWLog(ex);
}

function balRect(ex){return ex.el.querySelector('.bal').getBoundingClientRect();}
function sideAt(ex,cx,cy){
  const r=balRect(ex);
  if(!r||!r.width||cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;
  return(cx-r.left)<r.width/2?'L':'R';
}
function setZone(ex,side){
  const both=(side==='B'),zl=ex.el.querySelector('.dzL'),zr=ex.el.querySelector('.dzR');
  if(!zl||!zr)return;
  zl.style.display=(both||side==='L')?'block':'none';
  zr.style.display=(both||side==='R')?'block':'none';
}
function makeGhost(ex,k,val){
  const sz=itemSize({k,val},1),d=document.createElement('div');
  d.className='ghostobj';
  d.innerHTML='<svg viewBox="0 0 '+sz[0]+' '+sz[1]+'" width="'+Math.round(sz[0]*1.4)+'" height="'+Math.round(sz[1]*1.4)+'">'+itemMarkup({k,val},0,0,sz[0],sz[1],labelOf(ex),'')+'</svg>';
  document.body.appendChild(d);
  return d;
}
function moveGhosts(e){
  if(!drag)return;
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  if(drag.ghost2){
    const r=balRect(drag.ex);
    const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    drag.ghost2.style.left=(2*(r.left+r.width/2)-e.clientX)+'px';
    drag.ghost2.style.top=e.clientY+'px';
    drag.ghost2.style.display=(drag.from||inside)?'block':'none';
  }
}
function endDragListeners(){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragUp);
  window.removeEventListener('pointercancel',onDragCancel);
  window.removeEventListener('keydown',onDragKey);
  document.body.classList.remove('dragging');
}
function startDrag(e,ex,k,val,from){
  if(drag||!student||ex.locked||(ex.mode!==2&&ex.mode!==3))return;
  if(e.button!==undefined&&e.button!==0)return;
  if(e.preventDefault)e.preventDefault();
  try{if(e.target&&e.target.releasePointerCapture&&e.pointerId!==undefined)e.target.releasePointerCapture(e.pointerId);}catch(_){}
  drag={ex,k,val:+val||1,from,sx:e.clientX,sy:e.clientY,started:false,ghost:null,ghost2:null};
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragUp);
  window.addEventListener('pointercancel',onDragCancel);
  window.addEventListener('keydown',onDragKey);
}
function onDragMove(e){
  if(!drag)return;
  const ex=drag.ex;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;
    drag.started=true;drag.ghost=makeGhost(ex,drag.k,drag.val);
    if(ex.mode===3)drag.ghost2=makeGhost(ex,drag.k,drag.val);
    document.body.classList.add('dragging');
    clearFb(ex);
    if(ex.mode===2&&drag.from){tryRemove(ex.built[drag.from],drag.k,drag.val);render(ex);}
    if(ex.mode===3&&drag.from){ex.dimK={k:drag.k,val:drag.val};draw(ex);}
  }
  moveGhosts(e);
  const sd=sideAt(ex,e.clientX,e.clientY);
  setZone(ex,ex.mode===3?(sd&&!drag.from?'B':null):sd);
}
function cleanDrag(d){
  if(d.ghost)d.ghost.remove();if(d.ghost2)d.ghost2.remove();
  setZone(d.ex,null);d.ex.dimK=null;
}
function onDragUp(e){
  if(!drag)return;
  const d=drag,ex=d.ex;drag=null;endDragListeners();
  if(!d.started){
    if(ex.mode===3)doOp(ex,d.k,d.val,d.from?'-':'+');
    else if(d.from){tryRemove(ex.built[d.from],d.k,d.val);clearFb(ex);render(ex);}
    else setFb(ex,'q',()=>tr('drag_hint'));
    return;
  }
  cleanDrag(d);
  const side=sideAt(ex,e.clientX,e.clientY);
  if(ex.mode===3){
    draw(ex);
    if(d.from){if(!side)doOp(ex,d.k,d.val,'-');}
    else if(side)doOp(ex,d.k,d.val,'+');
    return;
  }
  if(side){
    const r=tryAdd(ex.built[side],d.k,d.val);
    if(!r.ok){if(d.from)tryAdd(ex.built[d.from],d.k,d.val);render(ex);setFb(ex,'warn',()=>tr(r.msg));return;}
    clearFb(ex);render(ex);
    if(r.note)setFb(ex,'q',()=>tr('note'));
    return;
  }
  clearFb(ex);render(ex);
}
function onDragCancel(){
  if(!drag)return;
  const d=drag,ex=d.ex;drag=null;endDragListeners();
  cleanDrag(d);
  if(ex.mode===2&&d.started&&d.from)tryAdd(ex.built[d.from],d.k,d.val);
  render(ex);
}
function onDragKey(e){if(e.key==='Escape')onDragCancel();}

  return{a:[x,x+d2],s:'['+a+'x + '+b+'(x+'+d2+') = '+T2+'] \u2192 '+x+' y '+(x+d2),
   q:{es:'En una tienda, '+a+' libretas y '+b+' carpetas cuestan '+T2+' \u20ac. Cada carpeta cuesta '+d2+' \u20ac m\u00e1s que cada libreta. \u00bfCu\u00e1nto cuesta cada cosa?',
      eu:'Denda batean, '+a+' koaderno eta '+b+' karpeta '+T2+' \u20ac balio dute. Karpeta bakoitzak koaderno bakoitzak baino '+d2+' \u20ac gehiago balio du. Zenbat balio du bakoitzak?'}};}
];
function genProb(kind,seed){
  const r=rng(seed*7717+(kind==='c'?91:13));
  const arr=kind==='c'?PROBC:PROBE;
  return arr[Math.floor(r()*arr.length)%arr.length](r);
}

let WBS={};
function tr0(o){return typeof o==='string'?o:(o?(o[L]||o.es||''):'');}
function wbKey(si,ii){return si+'-'+ii;}
function wbSave(){ssSet('bal_wb',JSON.stringify(WBS));}
function wbLoad(){try{WBS=JSON.parse(ssGet('bal_wb')||'{}')||{};}catch(e){WBS={};}}
function wbNums(s){
  let t=String(s||'').replace(/[\u2212\u2013\u2014]/g,'-').replace(/[\u2248~]/g,' ').replace(/(\d)[.,](\d)/g,'$1.$2');
  const out=[],re=/\u00b1?\s*-?\d+(?:\.\d+)?(?:\s*\/\s*-?\d+(?:\.\d+)?)?/g;let m;
  while((m=re.exec(t))){
    let x=m[0].replace(/\s+/g,''),pm=false;
    if(x[0]==='\u00b1'){pm=true;x=x.slice(1);}
    let v;
    if(x.indexOf('/')>0){const p=x.split('/');v=parseFloat(p[0])/parseFloat(p[1]);}else v=parseFloat(x);
    if(!isFinite(v))continue;
    out.push(v);if(pm)out.push(-v);
  }
  return out;
}
function wbHasAll(raw,a){
  if(!a||!a.length)return false;
  const got=wbNums(raw);
  return a.every(v=>got.some(g=>Math.abs(g-v)<=Math.max(0.011,Math.abs(v)*0.004)));
}
function wbNone(s){return /ez dago|ez du|soluziorik|ezinezko|ez da posible|no hay|no tiene|sin soluci|ninguna|imposible|no existe|nunca|inoiz/i.test(String(s||''));}
function wbSolTxt(it){
  if(it.s)return tr0(it.s);
  if(it.none)return tr('wb_none');
  return 'x = '+it.a.map(v=>numSigned(v)).join(' ; ');
}
function wbItemHTML(si,ii,it){
  const q=it.eq?('<span class="eqbig">'+mathHTML(it.eq)+'</span>'):tr0(it.q);
  return '<div class="wbit" data-s="'+si+'" data-i="'+ii+'"><div class="wbq"><b>'+it.n+'.</b> '+q+'</div>'+
   '<div class="row"><input type="text" class="wbin" autocomplete="off" aria-label="'+it.n+'" placeholder="'+tr(it.none?'wb_phn':'wb_ph')+'">'+
   '<button type="button" class="wbsend">'+tr('wb_send')+'</button></div>'+
   '<div class="fb wbfb" hidden aria-live="polite"></div></div>';
}
function wbPaneHTML(t){
  let h='<div class="card">'+head(t)+'<div class="mission fb q" style="margin:0 0 4px">'+tr('m_wb')+'</div><div class="fb warn">'+tr('wb_tip')+'</div></div>';
  WB.forEach((sec,si)=>{
    h+='<section class="card wbsec" data-s="'+si+'"><h3 class="exn">'+tr0(sec.t)+' <span class="goal wbprog"></span></h3>'+
       (sec.d?'<div class="fb q">'+tr0(sec.d)+'</div>':'')+sec.it.map((it,ii)=>wbItemHTML(si,ii,it)).join('')+'</section>';
  });
  return h;
}
function wbShow(el){
  const si=+el.dataset.s,ii=+el.dataset.i,st=WBS[wbKey(si,ii)],fb=el.querySelector('.wbfb');
  const inp=el.querySelector('.wbin'),btn=el.querySelector('.wbsend');
  const sent=!!(st&&st.sent);
  if(inp)inp.disabled=sent;
  if(btn)btn.disabled=sent;
  el.classList.toggle('sent',sent);
  if(!st||!st.fb){fb.hidden=true;fb.innerHTML='';return;}
  const it=WB[si].it[ii];
  fb.className='fb wbfb '+st.fb.cls;
  fb.innerHTML=tr(st.fb.k)+(st.fb.sol?'<div style="margin-top:4px"><b>'+tr('wb_sol')+'</b> '+wbSolTxt(it)+'</div>':'');
  fb.hidden=false;
}
function wbProg(){
  WB.forEach((sec,si)=>{
    const el=document.querySelector('#pane9 .wbsec[data-s="'+si+'"] .wbprog');
    if(!el)return;
    let n=0;sec.it.forEach((_,ii)=>{const st=WBS[wbKey(si,ii)];if(st&&st.ok)n++;});
    el.textContent=tr('wb_prog',[n,sec.it.length]);
  });
}
function wbRender(){
  document.querySelectorAll('#pane9 .wbit').forEach(el=>{
    const st=WBS[wbKey(+el.dataset.s,+el.dataset.i)];
    if(st&&st.v!==undefined)el.querySelector('.wbin').value=st.v;
    wbShow(el);
  });
  wbProg();
}
function wbDo(el){
  const si=+el.dataset.s,ii=+el.dataset.i,it=WB[si].it[ii],k=wbKey(si,ii);
  const st=WBS[k]||(WBS[k]={});
  if(st.sent){wbShow(el);return;}
  const raw=el.querySelector('.wbin').value;
  st.v=raw;
  if(!raw.trim()){st.fb={cls:'warn',k:'wb_empty',sol:false};wbSave();wbShow(el);return;}
  const ok=it.none?(wbNone(raw)||wbHasAll(raw,it.a)):wbHasAll(raw,it.a);
  st.ok=ok;st.sent=true;
  st.fb={cls:ok?'ok':'bad',k:ok?'wb_ok':'wb_bad',sol:true};
  track('palabras-ecuaciones',ok?'correcto':'incorrecto',it.n+': '+raw,null);
  logAns('t_wb',it.n+'. '+(it.eq?it.eq:tr0(it.q)),raw,ok?'ok':'bad',wbSolTxt(it));
  wbSave();wbShow(el);wbProg();
}
