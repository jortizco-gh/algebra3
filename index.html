.opx{background:var(--tuL);border:2px solid var(--tu);border-radius:7px;padding:0 6px;font-weight:800;white-space:nowrap}
.arr{color:var(--es);font-weight:800}

.step:last-child{border-bottom:0}

.stepE{margin-top:2px;font-size:1.08rem;line-height:1.9;font-variant-numeric:tabular-nums}
.linedesc{font-size:.9rem;font-weight:600;color:#5a5a5c}
.goal{background:var(--esL);border:1px solid var(--es);border-radius:9px;padding:4px 10px;display:inline-block;font-size:.92rem;font-weight:600;margin:4px 0}
.vrow{background:var(--esL);border:1px solid var(--es);border-radius:10px;padding:6px 10px}

.sendbox button{font-size:1.15rem;padding:10px 26px}
.sendbox .fb{margin:0}
.rstat{background:var(--esL);border:1px solid var(--es);border-radius:10px;padding:8px 12px;margin:8px 0;line-height:1.6}
.rq{display:flex;flex-direction:column;gap:4px;flex:1;min-width:14em}
.ghostobj{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))}
.dz{fill:rgba(175,203,55,.2);stroke:#00a083;stroke-width:3;stroke-dasharray:8 6;pointer-events:none}
body.dragging,body.dragging *{cursor:grabbing!important}
#syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.35);font-size:.9rem}
#login{max-width:620px;margin:18px auto}
#login h2{margin:.1em 0 .3em}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}
.fgrid label{display:flex;flex-direction:column;gap:3px}
.fgrid input,.fgrid select{font-size:1.1rem;width:100%}
.mailrow{display:flex;align-items:center;gap:6px}
.mailrow input{flex:1}
.dom{font-weight:700;white-space:nowrap}
.priv{background:var(--tuL);border:1px solid var(--tu);border-radius:8px;padding:8px 12px;font-size:.93rem;margin:8px 0}
.chkrow{display:flex;gap:8px;align-items:center;margin:8px 0}
#lgGo{font-size:1.1rem;padding:10px 24px}
#lgSkip{margin-left:10px}

.sub{margin:.1em 0 .6em;font-size:1.05rem;font-weight:600;color:#5a5a5c}
.katex{font-size:1.06em}
.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.12;margin:-.15em .22em}
.frac .fn{border-bottom:2px solid currentColor;padding:0 .28em .08em;width:100%}
.frac .fd{padding:.08em .28em 0;width:100%}
.wex{border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:10px 0;background:#fff}
.wex h3{margin:.1em 0 .35em;font-size:1.06rem}
.wex .idea{background:var(--tuL);border-left:7px solid var(--tu);border-radius:8px;padding:6px 10px;margin:6px 0;font-weight:600}
.wex .ok{background:var(--esL);border:1px solid var(--es);border-radius:8px;padding:5px 10px;display:inline-block;margin-top:4px;font-weight:600}
.wtab{border-collapse:collapse;margin:8px 0 4px;font-size:1.14rem}
.wtab td{padding:5px 2px;vertical-align:middle;line-height:1.9}
.wtab td.eqc{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.wtab td.eqs{text-align:center;padding:0 7px}
.wtab td.eqr{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.wtab td.opc{text-align:left;padding-left:16px}
.tok input{width:3.3em;font-size:.95rem;padding:2px 4px;text-align:center;border-width:2px;margin-top:2px}
.tok{cursor:default}
.tok .grab{cursor:grab}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px;margin:6px 0}
.cmp>div{border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.cmp h4{margin:.1em 0 .3em;font-size:.95rem;text-transform:uppercase;letter-spacing:.03em;color:#5a5a5c}
.cmp .bal0{background:var(--tuL)}
.cmp .sho{background:var(--liL)}
.rule{background:var(--esL);border:1px solid var(--es);border-radius:9px;padding:6px 10px;margin:6px 0;font-weight:600}
.mv{background:var(--li);border-radius:5px;padding:0 5px;font-weight:800}
#landing{max-width:920px;margin:28px auto;text-align:center}
.algebra-banner{--c-emerald:#00a083;--c-lime:#afcb37;--c-cyan:#00a4b7;--c-dark:#3b3b3d;position:relative;width:100%;max-width:920px;aspect-ratio:920/300;margin:0 auto;background:#fff;border:2px solid rgba(59,59,61,.15);border-radius:24px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Nimbus Sans","Helvetica Neue",Arial,sans-serif;font-weight:700;user-select:none;overflow:hidden}
.algebra-word{display:flex;align-items:baseline;justify-content:center;gap:.06em;font-size:clamp(2.4rem,11vw,7.6rem);line-height:1;letter-spacing:.02em;margin-bottom:14px;animation:color-shift 4s ease-in-out infinite}
.char-stack{display:inline-grid;place-items:center}
.char-stack>span{grid-area:1/1;text-align:center}
.layer-es{color:var(--c-emerald);animation:fade-es 4s ease-in-out infinite}
.layer-eu{color:var(--c-cyan);animation:fade-eu 4s ease-in-out infinite}
.progress-track{position:absolute;bottom:9%;width:26%;min-width:130px;max-width:240px;height:6px;background:rgba(59,59,61,.14);border-radius:999px;overflow:hidden}
.progress-pill{width:53%;height:100%;border-radius:999px;animation:pill-slide 4s ease-in-out infinite}
@keyframes color-shift{0%,34%,100%{color:var(--c-emerald)}50%,84%{color:var(--c-cyan)}}
@keyframes fade-es{0%,34%,100%{opacity:1;z-index:2}50%,84%{opacity:.24;z-index:1}}
@keyframes fade-eu{0%,34%,100%{opacity:.24;z-index:1}50%,84%{opacity:1;z-index:2}}
@keyframes pill-slide{0%,34%,100%{transform:translateX(0%);background-color:var(--c-emerald)}42%,92%{background-color:var(--c-lime)}50%,84%{transform:translateX(88.6%);background-color:var(--c-cyan)}}
.landbtns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:26px 0 12px}
.landbtns button{font-size:1.5rem;padding:16px 38px;border-radius:16px;min-width:220px;border:3px solid var(--gr)}
#goEs{background:var(--es);color:#fff}
#goEu{background:var(--tu);color:#fff}
.landbtns button:hover{box-shadow:0 0 0 5px var(--li)}
@media (prefers-reduced-motion:reduce){.layer-eu{display:none}.algebra-word,.layer-es,.progress-pill{animation:none!important}}
/* ---- informe PDF (impresion) ---- */
#report{display:none}
.rep-h h1{margin:0 0 4px;font-size:1.4rem}
.rep-ex{border:1px solid #cfdcdc;border-radius:8px;padding:6px 10px;margin:8px 0;break-inside:avoid}
.rep-ex h4{margin:0 0 4px}
.rep-res{font-weight:700;color:#00a083}
.rep-svg svg{width:8cm;height:auto}
#report h2{margin:14px 0 4px;break-after:avoid}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body>*:not(#report){display:none!important}
  #report{display:block}
  #report *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wex{break-inside:avoid}
}
</style>

<body>
<header id="hdr" hidden>
  <div class="hd">
    <h1>&#9878;&#65039; <span data-i18n="title"></span></h1>
    <div class="hr">
      <button id="langBtn" type="button" class="lang"></button>
      <span id="who" hidden></span>
      <button id="logout" type="button" class="light" hidden data-i18n="btn_logout"></button>
    </div>
  </div>
  <div id="syncbar" hidden>
    <span id="syncTxt" aria-live="polite"></span>
    <button id="retry" type="button" class="light" hidden data-i18n="btn_retry"></button>
  </div>
</header>
<main>
  <section id="landing" aria-label="ALGEBRA">
    <div class="algebra-banner" role="img" aria-label="ÁLGEBRA / ALJEBRA">
      <div class="algebra-word" aria-hidden="true">
        <span class="char-stack"><span>A</span><span class="layer-es">Á</span></span>
        <span>L</span>
        <span class="char-stack"><span class="layer-es">G</span><span class="layer-eu">J</span></span>
        <span>E</span><span>B</span><span>R</span><span>A</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div class="progress-pill"></div></div>
    </div>
    <div class="landbtns">
      <button id="goEs" type="button" lang="es">Castellano</button>
      <button id="goEu" type="button" lang="eu">Euskara</button>
    </div>
  </section>
  <section class="card" id="login" hidden>
    <h2 data-i18n="lg_title"></h2>
    <form id="lgForm" novalidate>
      <div class="fgrid">
        <label><span data-i18n="f_ap"></span><input id="lgAp" type="text" autocomplete="family-name" maxlength="40"></label>
        <label><span data-i18n="f_nom"></span><input id="lgNom" type="text" autocomplete="given-name" maxlength="40"></label>
        <label><span data-i18n="f_grp"></span><select id="lgGrp"></select></label>
        <label><span data-i18n="f_mail"></span>
          <span class="mailrow"><input id="lgMail" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40"><span class="dom" id="lgDom"></span></span>
        </label>
      </div>
      <div class="priv" id="privBox" hidden></div>
      <label class="chkrow" id="lgChkRow"><input type="checkbox" id="lgChk"> <span data-i18n="priv_chk"></span></label>
      <div class="fb bad" id="lgErr" role="alert" hidden></div>
      <button type="submit" id="lgGo" data-i18n="btn_start"></button>
      <button type="button" id="lgSkip" class="ghost" data-i18n="btn_skip"></button>
    </form>
  </section>
  <div id="app" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>
  </div>
</main>
<div id="report"></div>

const DIMS={b:[64,58],nb:[64,58],u:[36,34],g:[40,54]};
const KORD={b:0,nb:1,u:2,g:3};
function panItems(p,W){
  const out=[];
  const nx=Math.round(Math.abs(p.x)),kx=p.x<0?'nb':'b';
  for(let i=0;i<nx;i++)out.push({k:kx,val:1});
  let v=Math.round(Math.abs(p.c));const kw=p.c<0?'g':'u';
  const u=Math.max(1,Math.round((W&&W[kw])||1));
  if(u>1){const q=Math.floor(v/u);for(let i=0;i<q;i++)out.push({k:kw,val:u});v-=q*u;}
  for(let i=0;i<v;i++)out.push({k:kw,val:1});
  return out;
}
function viewList(prev,cur,W){
  const key=it=>it.k+':'+it.val;
  const cnt=list=>{const m=new Map();list.forEach(it=>m.set(key(it),(m.get(key(it))||0)+1));return m;};
  const a=prev?cnt(panItems(prev,W)):null,b=cnt(panItems(cur,W));
  const ks=[];const push=k=>{if(ks.indexOf(k)<0)ks.push(k);};
  if(a)a.forEach((v,k)=>push(k));b.forEach((v,k)=>push(k));
  ks.sort((p,q)=>{
    const[pk,pv]=p.split(':'),[qk,qv]=q.split(':');
    return KORD[pk]-KORD[qk]||(+qv)-(+pv);
  });
  const out=[];
  ks.forEach(kk=>{
    const sp=kk.split(':'),k=sp[0],val=+sp[1];
    const pn=a?(a.get(kk)||0):0,cn=b.get(kk)||0,n=Math.max(pn,cn);
    for(let i=0;i<n;i++){
      const ghost=i>=cn,hl=!ghost&&i>=pn;
      out.push({k,val,ghost,hl});
    }
  });
  return out;
}
function applyDim(items,dim){
  const out=items.map(it=>({k:it.k,val:it.val,ghost:it.ghost,hl:it.hl}));
  for(let i=out.length-1;i>=0;i--){
    if(out[i].k===dim.k&&out[i].val===dim.val&&!out[i].ghost){out[i].ghost=true;break;}
  }

}
function itemSize(it,s){
  const d=DIMS[it.k]||DIMS.u;

  return[w*s,d[1]*s];

function layoutPan(items,cx,base,W,H){
  const build=s=>{
    const rows=[];let row=[],rw=0,rh=0;
    for(const it of items){
      const sz=itemSize(it,s),w=sz[0]+6,h=sz[1];
      if(row.length&&rw+w>W){rows.push({row,rh});row=[];rw=0;rh=0;}
      row.push({it,w,h});rw+=w;rh=Math.max(rh,h);
    }
    if(row.length)rows.push({row,rh});
    return rows;
  };
  let s=1,rows=build(s);
  const tall=rs=>rs.reduce((a,r)=>a+r.rh,0)+6*Math.max(0,rs.length-1);
  while(tall(rows)>H&&s>0.28){s*=0.88;rows=build(s);}
  const out=[];let yb=base;
  for(const r of rows){
    const rw=r.row.reduce((a,q)=>a+q.w,0);let x=cx-rw/2;
    for(const q of r.row){
      out.push({k:q.it.k,val:q.it.val,ghost:q.it.ghost,hl:q.it.hl,x:x+3,y:yb-q.h,w:q.w-6,h:q.h,base:yb});
      x+=q.w;
    }

  }

function drawScene(g,s,o){
  const th=o.angle*Math.PI/180,P={x:450,y:95},Lh=270,S=200,W=o.W||{u:1,g:1};
  const ends=[
    {side:'L',x:P.x-Lh*Math.cos(th),y:P.y+Lh*Math.sin(th),d:s.L},
    {side:'R',x:P.x+Lh*Math.cos(th),y:P.y-Lh*Math.sin(th),d:s.R}];

          '<polygon points="450,95 422,478 478,478" fill="#00a083"/>';

     `<circle cx="450" cy="95" r="14" fill="#afcb37" stroke="#3b3b3d" stroke-width="3"/>`+pans+items;

function flush(){

  if(!CONFIG.ENDPOINT||!queue.length)return Promise.resolve();
  flushP=(async()=>{
    sending=true;updateSync();

function check1(ex){
  if(ex.locked)return;
  const raw=ex.el.querySelector('.ans').value;
  let e;
  try{e=parseEq(raw);}
  catch(err){const msg=err.message;setFb(ex,'bad',()=>msg);track('traduce','error de escritura',raw,ex);return;}
  if(e.vars.size===0){setFb(ex,'bad',()=>tr('f1_noletter'));track('traduce','sin letra',raw,ex);return;}
  const tg={L:{a:ex.task.L.x,b:ex.task.L.c},R:{a:ex.task.R.x,b:ex.task.R.c}};
  const j=judge(e,tg);ex.answer=raw;
  let res;
  if(j==='exact'||j==='swap'){res='correcto';setFb(ex,'ok',()=>'✔ '+tr('f1_ok'),true);}
  else if(j==='equiv'){res='equivalente';setFb(ex,'warn',()=>tr('f1_equiv')+solHTML(ex),true);}
  else{res='incorrecto';setFb(ex,'bad',()=>diag(e,tg,1)+solHTML(ex),true);}
  track('traduce',res,raw,ex);lockEx(ex,res);
}

function tryAdd(q,k,val){
  if(k==='b'){if(q.x>=8)return{ok:false,msg:'maxb'};q.x++;return{ok:true};}
  if(k==='nb'){if(q.x<=-8)return{ok:false,msg:'maxb'};q.x--;return{ok:true};}
  if(k==='u'){if(q.c+val>99)return{ok:false,msg:'maxu'};const note=q.c<0;q.c+=val;return{ok:true,note};}
  if(q.c-val<-99)return{ok:false,msg:'maxg'};
  const note=q.c>0;q.c-=val;return{ok:true,note};
}
function tryRemove(q,k,val){
  if(k==='b'&&q.x>0){q.x--;return true;}
  if(k==='nb'&&q.x<0){q.x++;return true;}
  if(k==='u'&&q.c>=val){q.c-=val;return true;}
  if(k==='g'&&q.c<=-val){q.c+=val;return true;}
  return false;
}
function check2(ex){
  if(ex.locked)return;
  const b=ex.built;
  const e={L:{a:b.L.x,b:b.L.c},R:{a:b.R.x,b:b.R.c}};
  const tg={L:{a:ex.task.L.x,b:ex.task.L.c},R:{a:ex.task.R.x,b:ex.task.R.c}};
  const mine=fmtInt(b);
  if(!b.L.x&&!b.L.c&&!b.R.x&&!b.R.c){setFb(ex,'warn',()=>tr('f2_empty'));track('construye','vacío','',ex);return;}
  const j=judge(e,tg);ex.answer=mine;
  let res;
  if(j==='exact'){res='correcto';setFb(ex,'ok',()=>'✔ '+tr('f2_ok'));}
  else if(j==='swap'){res='correcto';setFb(ex,'ok',()=>'✔ '+tr('f2_swap'));}
  else if(j==='equiv'){res='equivalente';setFb(ex,'warn',()=>tr('f2_equiv'));}
  else{res='incorrecto';setFb(ex,'bad',()=>diag(e,tg,2));}
  if(res!=='correcto'&&!ex.free){ex.showSol=true;showSolView(ex);}
  track('construye',res,mine,ex);lockEx(ex,res);
}
/* ----- modo 3 ----- */
function doOp(ex,k,val,sg){
  if(ex.locked||ex.mode!==3)return;
  if(['b','nb','u','g'].indexOf(k)<0)return;
  val=+val||1;
  const s=clone(ex.st3),sd=[s.L,s.R];
  let err='';
  if(k==='b'){
    if(sg==='-'){if(sd.some(p=>p.x<1))err='er_b';else sd.forEach(p=>p.x-=1);}
    else{if(sd.some(p=>p.x+1>8))err='er_b8';else sd.forEach(p=>p.x+=1);}
  }else if(k==='nb'){
    if(sg==='-'){if(sd.some(p=>p.x>-1))err='er_nb';else sd.forEach(p=>p.x+=1);}
    else{if(sd.some(p=>p.x-1<-8))err='er_b8';else sd.forEach(p=>p.x-=1);}
  }else if(k==='u'){
    if(sg==='-'){if(sd.some(p=>p.c<val))err='er_u';else sd.forEach(p=>p.c-=val);}
    else{if(sd.some(p=>p.c+val>99))err='maxu';else sd.forEach(p=>p.c+=val);}
  }else{
    if(sg==='-'){if(sd.some(p=>p.c>-val))err='er_g';else sd.forEach(p=>p.c+=val);}
    else{if(sd.some(p=>p.c-val<-99))err='maxg';else sd.forEach(p=>p.c-=val);}
  }
  if(err){const e2=err;setFb(ex,'warn',()=>tr(e2,[val]));draw(ex);return;}
  pushState(ex,s,{parts:[{key:sg==='-'?'l_rm':'l_add',args:[objName(k,val)]}],sym:symFor(k,val,sg)});
}
function pushState(ex,s,entry){
  entry.prev=clone(ex.st3);entry.state=clone(s);
  ex.hist.push(clone(ex.st3));ex.st3=s;
  ex.logArr.push(entry);ex.steps++;
  clearFb(ex);
  track('paso','—',entryText(entry,'es')+' ('+entry.sym+') → '+fmtInt(s),ex);
  const sv=solvedVal(s),sn=solvedNeg(s);
  if(sv!==null){
    setFb(ex,'ok',()=>tr('solved'));
    if(!ex.solvedLogged){ex.solvedLogged=true;track('resuelto','correcto','x = '+sv,ex);}
  }else if(sn!==null){setFb(ex,'q',()=>tr('solved_neg'));}
  renderLog(ex);draw(ex);
}
function undo(ex){
  if(ex.locked||!ex.hist.length)return;
  ex.st3=ex.hist.pop();ex.logArr.pop();clearFb(ex);

function renderWLog(ex){
  const lg=ex.el&&ex.el.querySelector('.wlog');if(!lg)return;
  lg.innerHTML=ex.wlines.map((l,i)=>
    `<div class="step"><div class="stepE">${i+1}. ${mathHTML(fmtEqG(l))}</div>`+
    (l.d?`<div class="linedesc">${tr(l.d.key,l.d.args)}</div>`:'')+`</div>`).join('');
  lg.scrollTop=lg.scrollHeight;
}
function describeStep(prev,cur){
  const nr=(a,b)=>Math.abs(a-b)<1e-7;
  const dLx=cur.L.x-prev.L.x,dRx=cur.R.x-prev.R.x,dLc=cur.L.c-prev.L.c,dRc=cur.R.c-prev.R.c;
  if(nr(dLx,dRx)&&nr(dLc,dRc)){
    if(nr(dLx,0)&&nr(dLc,0))return{same:true};
    if(dLx<=1e-9&&dLc<=1e-9)return{key:'esc_sub',args:[fmtSideG({x:-dLx,c:-dLc})]};
    return{key:'esc_add',args:[fmtSideG({x:dLx,c:dLc})]};
  }
  const comps=[[prev.L.x,cur.L.x],[prev.L.c,cur.L.c],[prev.R.x,cur.R.x],[prev.R.c,cur.R.c]];
  let f=null;
  for(const c of comps){if(Math.abs(c[0])>1e-9){f=c[1]/c[0];break;}}
  if(f!==null&&Math.abs(f)>1e-9&&comps.every(c=>Math.abs(c[1]-f*c[0])<1e-7)){
    const inv=1/f;
    if(Math.abs(f)>=1-1e-9)return{key:'esc_mul',args:[numSigned(f)]};
    if(Math.abs(inv-Math.round(inv))<1e-9)return{key:'esc_div',args:[numSigned(Math.round(inv))]};
    return{key:'esc_mul',args:[numSigned(f)]};
  }
  return{key:'esc_gen',args:[]};
}
function checkStep(ex){
  if(ex.locked)return;
  const inp=ex.el.querySelector('.wans'),raw=inp.value;
  let e;
  try{e=parseEq(raw);}
  catch(err){const msg=err.message;setFb(ex,'bad',()=>msg);track('escribe','error de escritura',raw,ex);return;}
  if(e.vars.size===0){setFb(ex,'bad',()=>tr('esc_novar'));track('escribe','sin letra',raw,ex);return;}
  const prev=ex.wlines[ex.wlines.length-1];
  const cur={L:{x:e.L.a,c:e.L.b},R:{x:e.R.a,c:e.R.b}};
  const p=prev.L.x-prev.R.x,q=prev.R.c-prev.L.c,p2=cur.L.x-cur.R.x,q2=cur.R.c-cur.L.c;
  if(Math.abs(p2)<1e-9){setFb(ex,'bad',()=>tr('esc_novar'));track('escribe','pierde la x',raw,ex);return;}
  if(Math.abs(p2*q-q2*p)>1e-6){
    const sameL=Math.abs(cur.L.x-prev.L.x)<1e-9&&Math.abs(cur.L.c-prev.L.c)<1e-9;
    const sameR=Math.abs(cur.R.x-prev.R.x)<1e-9&&Math.abs(cur.R.c-prev.R.c)<1e-9;
    const key=(sameL!==sameR)?'esc_one':'esc_bad';
    setFb(ex,'bad',()=>tr(key));track('escribe','paso incorrecto',raw,ex);return;
  }
  const d=describeStep(prev,cur);
  if(d.same){setFb(ex,'warn',()=>tr('esc_same'));return;}
  if(ex.mode===5)d.key='sh_'+d.key.slice(4);
  ex.wlines.push({L:cur.L,R:cur.R,d:{key:d.key,args:d.args}});
  ex.steps++;ex.answer=raw;inp.value='';eqPreview(inp);
  renderWLog(ex);
  track('escribe','paso',fmtEqG(cur),ex);
  const sv=solvedVal(cur),sn=solvedNeg(cur);
  if(sv!==null){
    const l=ex.task.L.x*sv+ex.task.L.c,r=ex.task.R.x*sv+ex.task.R.c;
    setFb(ex,'ok',()=>tr('esc_fin',[numSigned(sv)])+' '+tr('esc_chk',[numAbs(l),numAbs(r)]));
    ex.answer='x = '+sv;
    track('escribe','correcto','x = '+sv,ex);
    lockEx(ex,'correcto');
  }else if(sn!==null){setFb(ex,'q',()=>tr('esc_neg'));}
  else setFb(ex,'ok',()=>tr(d.key,d.args));
}
function undoStep(ex){
  if(ex.locked||ex.wlines.length<2)return;
  ex.wlines.pop();clearFb(ex);renderWLog(ex);
}
function resetWrite(ex){
  if(ex.locked)return;
  ex.wlines=[{L:clone(ex.task.L),R:clone(ex.task.R),d:null}];
  const inp=ex.el.querySelector('.wans');if(inp){inp.value='';eqPreview(inp);}
  clearFb(ex);renderWLog(ex);
}

  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=('balanzas_'+student.ap+'_'+student.nom+'.csv').replace(/\s+/g,'_');
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
/* ----- arrastrar y soltar ----- */
function balRect(ex){return ex.el.querySelector('.bal').getBoundingClientRect();}
function sideAt(ex,cx,cy){
  const r=balRect(ex);
  if(!r||!r.width||cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;
  return(cx-r.left)<r.width/2?'L':'R';
}
function setZone(ex,side){
  const both=(side==='B'),zl=ex.el.querySelector('.dzL'),zr=ex.el.querySelector('.dzR');
  if(!zl||!zr)return;
  zl.style.display=(both||side==='L')?'block':'none';
  zr.style.display=(both||side==='R')?'block':'none';
}
function makeGhost(ex,k,val){
  const sz=itemSize({k,val},1),d=document.createElement('div');
  d.className='ghostobj';
  d.innerHTML=`<svg viewBox="0 0 ${sz[0]} ${sz[1]}" width="${Math.round(sz[0]*1.4)}" height="${Math.round(sz[1]*1.4)}">`+itemMarkup({k,val},0,0,sz[0],sz[1],labelOf(ex),'')+'</svg>';
  document.body.appendChild(d);
  return d;
}
function moveGhosts(e){
  if(!drag)return;
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  if(drag.ghost2){
    const r=balRect(drag.ex);
    const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    drag.ghost2.style.left=(2*(r.left+r.width/2)-e.clientX)+'px';
    drag.ghost2.style.top=e.clientY+'px';
    drag.ghost2.style.display=(drag.from||inside)?'block':'none';
  }
}
function endDragListeners(){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragUp);
  window.removeEventListener('pointercancel',onDragCancel);
  window.removeEventListener('keydown',onDragKey);
  document.body.classList.remove('dragging');
}
function startDrag(e,ex,k,val,from){
  if(drag||!student||ex.locked||(ex.mode!==2&&ex.mode!==3))return;
  if(e.button!==undefined&&e.button!==0)return;
  if(e.preventDefault)e.preventDefault();
  try{if(e.target&&e.target.releasePointerCapture&&e.pointerId!==undefined)e.target.releasePointerCapture(e.pointerId);}catch(_){}
  drag={ex,k,val:+val||1,from,sx:e.clientX,sy:e.clientY,started:false,ghost:null,ghost2:null};
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragUp);
  window.addEventListener('pointercancel',onDragCancel);
  window.addEventListener('keydown',onDragKey);
}
function onDragMove(e){
  if(!drag)return;
  const ex=drag.ex;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;
    drag.started=true;drag.ghost=makeGhost(ex,drag.k,drag.val);
    if(ex.mode===3)drag.ghost2=makeGhost(ex,drag.k,drag.val);
    document.body.classList.add('dragging');
    clearFb(ex);
    if(ex.mode===2&&drag.from){tryRemove(ex.built[drag.from],drag.k,drag.val);render(ex);}
    if(ex.mode===3&&drag.from){ex.dimK={k:drag.k,val:drag.val};draw(ex);}
  }
  moveGhosts(e);
  const sd=sideAt(ex,e.clientX,e.clientY);
  setZone(ex,ex.mode===3?(sd&&!drag.from?'B':null):sd);
}
function cleanDrag(d){
  if(d.ghost)d.ghost.remove();if(d.ghost2)d.ghost2.remove();
  setZone(d.ex,null);d.ex.dimK=null;
}
function onDragUp(e){
  if(!drag)return;
  const d=drag,ex=d.ex;drag=null;endDragListeners();
  if(!d.started){
    if(ex.mode===3)doOp(ex,d.k,d.val,d.from?'-':'+');
    else if(d.from){tryRemove(ex.built[d.from],d.k,d.val);clearFb(ex);render(ex);}
    else setFb(ex,'q',()=>tr('drag_hint'));
    return;
  }
  cleanDrag(d);
  const side=sideAt(ex,e.clientX,e.clientY);
  if(ex.mode===3){
    draw(ex);
    if(d.from){if(!side)doOp(ex,d.k,d.val,'-');}
    else if(side)doOp(ex,d.k,d.val,'+');
    return;
  }
  if(side){
    const r=tryAdd(ex.built[side],d.k,d.val);
    if(!r.ok){if(d.from)tryAdd(ex.built[d.from],d.k,d.val);render(ex);setFb(ex,'warn',()=>tr(r.msg));return;}
    clearFb(ex);render(ex);
    if(r.note)setFb(ex,'q',()=>tr('note'));
    return;
  }
  clearFb(ex);render(ex);
}
function onDragCancel(){
  if(!drag)return;
  const d=drag,ex=d.ex;drag=null;endDragListeners();
  cleanDrag(d);
  if(ex.mode===2&&d.started&&d.from)tryAdd(ex.built[d.from],d.k,d.val);
  render(ex);
}
function onDragKey(e){if(e.key==='Escape')onDragCancel();}
/* ----- eventos ----- */
function exOf(node){const c=node&&node.closest?node.closest('.ex'):null;return c?EX[c.dataset.id]:null;}
function retoOf(node){const c=node&&node.closest?node.closest('.reto'):null;return c?+c.dataset.r:null;}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button.tab');if(!b)return;
  setTab(+b.id.split('_')[1]);
});
$('app').addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('button'):null;if(!b)return;
  if(b.classList.contains('npdf')){printReport();return;}
  if(b.classList.contains('ncsv')){downloadCSV();return;}
  if(b.classList.contains('nsend')){sendNotes();return;}
  if(b.classList.contains('send')){sendTab(+b.dataset.tab);return;}
  if(b.classList.contains('sendr')){sendReto(+b.dataset.r);return;}
  if(b.classList.contains('rchk1')){rChkEq(retoOf(b));return;}
  if(b.classList.contains('rchk2')){rChkNum(retoOf(b));return;}
  if(b.classList.contains('fnew')){newFree();return;}
  const ex=exOf(b);if(!ex)return;
  if(b.classList.contains('chk'))(ex.mode===1?check1:check2)(ex);
  else if(b.classList.contains('clr')){if(!ex.locked){ex.built={L:{x:0,c:0},R:{x:0,c:0}};clearFb(ex);render(ex);}}
  else if(b.classList.contains('undo'))undo(ex);
  else if(b.classList.contains('reset'))resetSteps(ex);
  else if(b.classList.contains('vchk'))verifyAns(ex);
  else if(b.classList.contains('wchk'))checkStep(ex);
  else if(b.classList.contains('wundo'))undoStep(ex);
  else if(b.classList.contains('wreset'))resetWrite(ex);
});
function eqPreview(inp){
  const row=inp.closest('.row'),host=row&&(row.querySelector('.eqprev')||(row.nextElementSibling&&row.nextElementSibling.classList.contains('eqprev')?row.nextElementSibling:null));
  if(host)host.innerHTML=inp.value.trim()?mathHTML(inp.value):'';
}
$('app').addEventListener('input',e=>{
  const t=e.target;if(!t||!t.classList)return;
  if(t.classList.contains('nt')){NOTES[t.dataset.k]=t.value;if(student&&!student.test)lsSet('bal_notes_'+student.id,JSON.stringify(NOTES));return;}
  if(t.classList.contains('eqin'))eqPreview(t);
  if(t.classList.contains('nsel')){
    const ex=exOf(t);if(!ex)return;
    const k=t.dataset.t,v=Math.max(1,Math.min(99,Math.round(+t.value||1)));
    ex.W[k]=v;updateTok(ex,k);draw(ex);return;
  }
  if(t.classList.contains('rq3')){const n=retoOf(t);if(n)RETO[n].txt=t.value;}
});
$('app').addEventListener('change',e=>{
  const t=e.target;if(!t||!t.classList)return;
  if(t.classList.contains('fmode')){FREE.mode=+t.value||1;ssSet('bal_free',JSON.stringify(FREE));newFree();}
  else if(t.classList.contains('flvl')){FREE.lvl=+t.value||1;ssSet('bal_free',JSON.stringify(FREE));newFree();}
  else if(t.classList.contains('fsol')){FREE.sol=SOLS.indexOf(t.value)>=0?t.value:'mix';ssSet('bal_free',JSON.stringify(FREE));newFree();}
});
$('app').addEventListener('pointerdown',e=>{
  const t=e.target;if(!t||!t.closest)return;
  const ex=exOf(t);if(!ex)return;
  if(t.classList&&t.classList.contains('nsel'))return;
  const it=t.closest('.item');
  if(it&&it.closest('.bal')){startDrag(e,ex,it.dataset.t,it.dataset.v,it.dataset.s);return;}
  const tk=t.closest('.tok');
  if(tk)startDrag(e,ex,tk.dataset.t,tk.dataset.v,null);
});
$('app').addEventListener('keydown',e=>{
  const t=e.target;if(!t||!t.classList)return;
  if(e.key==='Enter'&&(t.classList.contains('rq1')||t.classList.contains('rq2'))){
    e.preventDefault();const n=retoOf(t);
    if(t.classList.contains('rq1'))rChkEq(n);else rChkNum(n);
    return;
  }
  const ex=exOf(t);if(!ex)return;
  if(e.key==='Enter'){
    if(t.classList.contains('ans'))check1(ex);
    else if(t.classList.contains('vin'))verifyAns(ex);
    else if(t.classList.contains('wans')){e.preventDefault();checkStep(ex);}
  }
  if(e.key==='Enter'&&t.classList.contains('nsel')){e.preventDefault();return;}
  if((e.key==='Enter'||e.key===' ')&&t.classList.contains('tok')&&ex.mode===3&&!ex.locked){
    e.preventDefault();doOp(ex,t.dataset.t,+t.dataset.v||1,'+');
  }
});
$('lgForm').addEventListener('submit',doLogin);
$('lgSkip').addEventListener('click',doSkip);
$('logout').addEventListener('click',doLogout);
$('goEs').addEventListener('click',()=>pickLang('es'));
$('goEu').addEventListener('click',()=>pickLang('eu'));
$('langBtn').addEventListener('click',()=>setLang(L==='es'?'eu':'es'));
$('retry').addEventListener('click',()=>{syncState='idle';flush();});
window.addEventListener('pagehide',()=>{
  if(CONFIG.ENDPOINT&&queue.length&&typeof navigator!=='undefined'&&navigator.sendBeacon){
    try{navigator.sendBeacon(CONFIG.ENDPOINT,new Blob([JSON.stringify({token:CONFIG.TOKEN,rows:queue.slice(0,50)})],{type:'text/plain;charset=UTF-8'}));}catch(e){}
  }
});
/* ----- arranque ----- */
L=(lsGet('bal_lang')==='eu')?'eu':'es';
loadQueue();
if(ssGet('bal_started')==='1')started=true;
try{const s=JSON.parse(ssGet('bal_student')||'null');if(s&&s.mail&&s.ap&&s.nom&&s.grp){student=s;started=true;}}catch(e){}
applyI18n();showApp();
if(CONFIG.ENDPOINT&&queue.length){ensureTimer();flush();}
</script>
